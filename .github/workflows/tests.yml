name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            app: linux/KawaPaint.Linux.csproj
          - platform: windows
            os: windows-latest
            app: win/KawaPaint.Win.csproj

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      # The stock runtime packages only, as on a user's desktop: JPEG XL / JPEG 2000 must be found
      # under their versioned sonames, without the -dev symlinks.
      - name: Install native codec libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjxl0.7 libopenjp2-7
          echo "KAWAPAINT_REQUIRE_NATIVE_CODECS=1" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.platform }} app
        run: dotnet build ${{ matrix.app }} -c Release

      # Engine smoke suites plus the headless Avalonia UI checks (no display server needed).
      - name: Run tests
        run: dotnet test --project shared/KawaPaint.Tests -c Release --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: TestResults
          if-no-files-found: ignore

  web:
    name: Build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build web app
        run: dotnet build web/KawaPaint.Web.csproj -c Release
