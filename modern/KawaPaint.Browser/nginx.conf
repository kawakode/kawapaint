server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's stock mime.types has no .wasm entry; without this, browsers refuse to
    # WebAssembly.instantiateStreaming() the response and fall back to a slower path.
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/javascript text/css text/html application/json;
    gzip_min_length 1024;

    # _framework/* filenames are content-hashed by the build, so they're safe to cache forever.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
