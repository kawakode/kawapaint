name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            app: linux/KawaPaint.Linux.csproj
          - platform: windows
            os: windows-latest
            app: win/KawaPaint.Win.csproj
          # Apple Silicon, the architecture the macOS release targets.
          - platform: macos
            os: macos-15
            app: mac/KawaPaint.Mac.csproj

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      # The stock runtime packages only, as on a user's desktop: JPEG XL / JPEG 2000 must be found
      # under their versioned sonames, without the -dev symlinks.
      - name: Install native codec libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # The libjxl runtime package is versioned (libjxl0.7 on Ubuntu 24.04, newer on 26.04,
          # which ubuntu-latest now points to); install whichever one this image provides.
          jxl_package=$(apt-cache search --names-only '^libjxl0\.[0-9]+$' | cut -d' ' -f1 | sort -V | tail -n1)
          test -n "$jxl_package"
          echo "Installing $jxl_package"
          sudo apt-get install -y --no-install-recommends "$jxl_package" libopenjp2-7
          echo "KAWAPAINT_REQUIRE_NATIVE_CODECS=1" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.platform }} app
        run: dotnet build ${{ matrix.app }} -c Release

      # Engine smoke suites plus the headless Avalonia UI checks (no display server needed).
      - name: Run tests
        run: dotnet test --project shared/KawaPaint.Tests -c Release --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: TestResults
          if-no-files-found: ignore

  web:
    name: Build (web)
    # Pinned: the browser test installs Chromium through Playwright, which supports named Ubuntu
    # releases only and refused ubuntu-latest once it moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Published the way the Docker image is, so the trimmed output that users get is what runs.
      - name: Publish web app
        run: |
          dotnet workload install wasm-tools
          dotnet publish web/KawaPaint.Web.csproj -c Release -o publish/web

      # Loads the page in Chromium, draws a stroke and checks what only a real browser shows:
      # the app starts, the autosave snapshot reaches IndexedDB, the page asks before closing
      # with unsaved work, and the snapshot is restored on the next visit.
      - name: Smoke-test in a browser
        working-directory: web/tests
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          node smoke.mjs ../../publish/web/wwwroot

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshots
          path: web/tests/screenshots
          if-no-files-found: ignore

  # The Android head has no tests of its own yet; building it catches the breakage shared code
  # causes there (a missing platform guard, an API the mobile target lacks) before it is merged.
  android:
    name: Build (android)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Android app
        run: |
          dotnet workload install android
          dotnet build android/KawaPaint.Android.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
