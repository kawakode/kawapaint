name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    # Publish semver tags as releases.
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            rid: linux-x64
            project: linux/KawaPaint.Linux.csproj

          - platform: windows
            os: windows-latest
            rid: win-x64
            project: win/KawaPaint.Win.csproj

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Self-contained publish: the output runs without a .NET runtime installed
      # on the target machine. Binaries are not code-signed yet, so Windows
      # SmartScreen (and equivalent Linux/macOS "unknown publisher" warnings)
      # are expected until signing is set up.
      #
      # On a tag push, stamp the assembly/file version from the tag (stripping
      # a leading "v" if present) so the binary version matches the release.
      # Non-tag builds keep whatever default version the csproj files use.
      - name: Publish ${{ matrix.platform }} build
        shell: bash
        run: |
          version_args=()
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            version_args=(-p:Version="${tag#[vV]}")
          fi
          dotnet publish ${{ matrix.project }} -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }} "${version_args[@]}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KawaPaint-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath KawaPaint-${{ github.ref_name }}-${{ matrix.rid }}.zip

      # Both matrix jobs race to create the release; whichever loses the
      # "create" race just uploads to the release the other one made.
      - name: Attach archive to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes || true
          gh release upload "$tag" "KawaPaint-${tag}-${{ matrix.rid }}.zip" --clobber
