name: Build Binaries

on:
  workflow_dispatch:
  push:
    tags: '*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            rid: linux-x64
            project: linux/KawaPaint.Linux.csproj

          - platform: windows
            os: windows-latest
            rid: win-x64
            project: win/KawaPaint.Win.csproj

          - platform: macos
            # GitHub's standard macos-15 runner is Apple Silicon. Build natively so the apphost
            # and bundled JXL/JP2 libraries are checked on the same architecture they target.
            os: macos-15
            rid: osx-arm64
            project: mac/KawaPaint.Mac.csproj

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Self-contained publish: the output runs without a .NET runtime installed
      # on the target machine. Binaries are not code-signed yet, so Windows
      # SmartScreen (and equivalent Linux/macOS "unknown publisher" warnings)
      # are expected until signing is set up.
      #
      # On a tag push, stamp the assembly/file version from the tag (stripping
      # a leading "v" if present) so the binary version matches the release.
      # Non-tag builds keep whatever default version the csproj files use.
      - name: Publish ${{ matrix.platform }} build
        shell: bash
        run: |
          version_args=()
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            version_args=(-p:Version="${tag#[vV]}")
          fi
          dotnet publish ${{ matrix.project }} -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }} "${version_args[@]}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KawaPaint-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

      # Microsoft Store package. The Store re-signs it, so it is uploaded unsigned and never
      # trips SmartScreen for Store installs. The identity comes from repository variables
      # copied from Partner Center (Product identity page); until they are set the package
      # uses placeholder values that the Store will refuse.
      - name: Pack Microsoft Store MSIX
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '0.0.${{ github.run_number }}' }
          $identity = @{}
          if ($env:MSIX_IDENTITY_NAME) { $identity.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $identity.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $identity.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          ./win/msix/build-msix.ps1 -PublishDir publish/${{ matrix.rid }} -Version $version -Output KawaPaint-${{ matrix.rid }}.msix @identity

      - name: Upload MSIX artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: KawaPaint-${{ matrix.rid }}-msix
          path: KawaPaint-${{ matrix.rid }}.msix

      - name: Verify Apple Silicon macOS build
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          test -x publish/${{ matrix.rid }}/KawaPaint.Mac
          file publish/${{ matrix.rid }}/KawaPaint.Mac | grep -q 'Mach-O 64-bit executable arm64'
          codec_libraries=(
            libbrotlicommon.1.dylib
            libbrotlidec.1.dylib
            libbrotlienc.1.dylib
            libhwy.1.dylib
            libjxl.dylib
            libjxl_cms.0.12.dylib
            liblcms2.2.dylib
            libopenjp2.dylib
          )
          for library in "${codec_libraries[@]}"; do
            library_file="publish/${{ matrix.rid }}/$library"
            test -f "$library_file"
            if otool -L "$library_file" | grep -E '/opt/homebrew|/Cellar/'; then
              echo "$library still references Homebrew." >&2
              exit 1
            fi
            codesign --verify --strict "$library_file"
          done

      # Drag-to-Applications installer: KawaPaint.app (ad-hoc signed, not notarized) next to an
      # Applications link on a custom background. Built on every run so it can be tried from the
      # workflow artifacts before tagging.
      - name: Build macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          version="0.0.${{ github.run_number }}"
          name="KawaPaint-${{ matrix.rid }}.dmg"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${{ github.ref_name }}"
            name="KawaPaint-${{ github.ref_name }}-${{ matrix.rid }}.dmg"
          fi
          mac/dmg/build-dmg.sh publish/${{ matrix.rid }} "$version" "$name"
          echo "RELEASE_ASSET=$name" >> "$GITHUB_ENV"

      - name: Upload DMG artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: KawaPaint-${{ matrix.rid }}-dmg
          path: ${{ env.RELEASE_ASSET }}
          # Already compressed (UDZO); zipping it again only costs time.
          compression-level: 0

      # Single-file Linux package: download, mark executable, run. Built on every run so it can
      # be tried from the workflow artifacts before tagging; the zip stays for those who prefer it.
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          version="0.0.${{ github.run_number }}"
          name="KawaPaint-${{ matrix.rid }}.AppImage"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${{ github.ref_name }}"
            name="KawaPaint-${{ github.ref_name }}-${{ matrix.rid }}.AppImage"
          fi
          # appimagetool checks the desktop entry with desktop-file-validate.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          linux/appimage/build-appimage.sh publish/${{ matrix.rid }} "$version" "$name"
          # The packed app really starts: the batch CLI answers through the AppImage entry point.
          "./$name" --appimage-extract-and-run --script /nonexistent.kawa 2>&1 | tee appimage-run.log || true
          grep -q "^kawapaint:" appimage-run.log
          echo "EXTRA_RELEASE_ASSET=$name" >> "$GITHUB_ENV"

      - name: Upload AppImage artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: KawaPaint-${{ matrix.rid }}-appimage
          path: ${{ env.EXTRA_RELEASE_ASSET }}
          # Already compressed (squashfs); zipping it again only costs time.
          compression-level: 0

      - name: Package Linux/Windows release archive
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform != 'macos'
        shell: pwsh
        run: |
          $name = "KawaPaint-${{ github.ref_name }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath $name
          "RELEASE_ASSET=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Handed to the release job below, which publishes every platform's files in one go.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            ${{ env.RELEASE_ASSET }}
            ${{ env.EXTRA_RELEASE_ASSET }}
          compression-level: 0
          if-no-files-found: error

  # Android package. Always built so it can be tried from the workflow artifacts. It is attached
  # to releases only once a signing key is configured (secrets ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD): without one the APK is
  # signed with a throwaway debug key that changes on every run, and Android refuses to update an
  # installed app whose key changed - users would have to uninstall and lose their settings.
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Android package
        shell: bash
        run: |
          dotnet workload install android
          display_version="0.0.${{ github.run_number }}"
          name="KawaPaint-android.apk"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            display_version="${tag#[vV]}"
            name="KawaPaint-${tag}-android.apk"
          fi
          signing_args=()
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            keystore="$RUNNER_TEMP/kawapaint.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            signing_args=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$keystore"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
              -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
            )
            echo "ANDROID_SIGNED=true" >> "$GITHUB_ENV"
          fi
          # The run number only grows, which is what Android wants from a version code.
          dotnet publish android/KawaPaint.Android.csproj -c Release -o publish/android \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" \
            -p:ApplicationDisplayVersion="$display_version" \
            -p:ApplicationVersion="${{ github.run_number }}" \
            "${signing_args[@]}"
          apk=$(find publish/android -name '*-Signed.apk' | head -n1)
          test -n "$apk"
          cp "$apk" "$name"
          echo "ANDROID_APK=$name" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KawaPaint-android-apk
          path: ${{ env.ANDROID_APK }}
          compression-level: 0

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/') && env.ANDROID_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ${{ env.ANDROID_APK }}
          compression-level: 0
          if-no-files-found: error

  # One job creates the release and attaches everything. The platform jobs used to race each
  # other to create it, and a job that lost the race at the wrong moment could fail or leave
  # the release without its notes.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      # The install notes (Gatekeeper steps for the unsigned macOS app, etc.) are placed above
      # GitHub's generated changelog. Re-running the workflow on a tag replaces the files.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          ls -l release-assets
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --generate-notes --notes-file .github/release-notes.md
          fi
